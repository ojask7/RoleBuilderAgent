spring:
  application:
    name: agent-api
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/agentdb
    username: agent
    password: agentpass
  flyway:
    enabled: true
    locations: filesystem:data/migrations/flyway
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  ai:
    azure:
      openai:
        api-key: ${AZURE_OPENAI_API_KEY:dummy-key}
        endpoint: https://your-endpoint.openai.azure.com/
        chat:
          options:
            deployment-name: ${AZURE_OPENAI_CHAT_DEPLOYMENT:gpt-4o-mini}
            temperature: 0.1
        embedding:
          options:
            deployment-name: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:text-embedding-3-large}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    username: ${AGENT_API_USERNAME:agent}
    password: ${AGENT_API_PASSWORD:agent-secret}
  vector-store:
    collection: iam-agent-default

# ---------------------------------------------------------------------------
# AccessForge Integration Connectors
# ---------------------------------------------------------------------------
accessforge:
  azure-ad:
    tenant-id: ${AZURE_AD_TENANT_ID:}
    client-id: ${AZURE_AD_CLIENT_ID:}
    client-secret: ${AZURE_AD_CLIENT_SECRET:}
    graph-endpoint: ${AZURE_AD_GRAPH_ENDPOINT:https://graph.microsoft.com/v1.0}
  sailpoint:
    tenant: ${SAILPOINT_TENANT:}
    client-id: ${SAILPOINT_CLIENT_ID:}
    client-secret: ${SAILPOINT_CLIENT_SECRET:}
  servicenow:
    instance: ${SERVICENOW_INSTANCE:}
    username: ${SERVICENOW_USERNAME:}
    password: ${SERVICENOW_PASSWORD:}
