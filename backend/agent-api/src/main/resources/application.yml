spring:
  application:
    name: agent-api
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/agentdb
    username: agent
    password: agentpass
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  ai:
    azure:
      openai:
        api-key: ${AZURE_OPENAI_API_KEY:dummy-key}
        endpoint: https://your-endpoint.openai.azure.com/
        chat:
          options:
            deployment-name: ${AZURE_OPENAI_CHAT_DEPLOYMENT:gpt-4o-mini}
            temperature: 0.1
        embedding:
          options:
            deployment-name: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:text-embedding-3-large}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    username: ${AGENT_API_USERNAME:agent}
    password: ${AGENT_API_PASSWORD:agent-secret}
  vector-store:
    collection: iam-agent-default
