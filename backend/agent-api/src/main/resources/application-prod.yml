spring:
  datasource:
    url: ${PROD_DB_URL:jdbc:postgresql://prod-host:5432/agent}
    username: ${PROD_DB_USERNAME:agent_app}
    password: ${PROD_DB_PASSWORD:change-me}
  jpa:
    properties:
      hibernate:
        jdbc.lob.non_contextual_creation: true
  ai:
    azure:
      openai:
        endpoint: ${AZURE_OPENAI_ENDPOINT:https://prod-openai.openai.azure.com/}

logging:
  level:
    root: INFO
    org.springframework.security: WARN
