groups:
  - name: agent-api.rules
    rules:
      - alert: AgentApiHighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{outcome="SERVER_ERROR"}[5m])) / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Agent API errors exceed 5%"
